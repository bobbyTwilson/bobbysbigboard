<body data-page="__PAGE__">
<div class="topline"></div>
<header><div class="header-inner wrap"><a href="/midnight-archive/" class="brand"><span class="brand-icon">✦</span><span><strong>The Midnight Archive</strong><small>BOBBY & LISA • EST. 2026</small></span></a>
<nav aria-label="Movie archive pages"><a href="/midnight-archive/">All movies</a><a href="/midnight-archive/bobby/">Bobby</a><a href="/midnight-archive/lisa/">Lisa</a><a href="/midnight-archive/compare/" class="__COMPARE_ACTIVE__">Compare</a><a href="/midnight-archive/stats/" class="__STATS_ACTIVE__">Stats</a><a href="/midnight-archive/timeline/" class="__TIMELINE_ACTIVE__">Watch history</a><a href="/midnight-archive/add/" class="__ADD_ACTIVE__">Add movie</a></nav></div></header>
<main class="wrap"><div id="root" aria-live="polite"><div class="page-hero"><div class="eyebrow">The Midnight Archive</div><h1>Loading the collection…</h1></div></div></main>
<footer><div class="wrap foot"><span><strong>The Midnight Archive</strong> • Movie nights, rated by us.</span><span>Unlisted archive • Noindex • Artwork belongs to its respective owners</span></div></footer>
<script id="vault-data" type="application/json">__FILMS_JSON__</script>
<script src="/midnight-archive/shared.js"></script>
<script>
(function(){
"use strict";
const MA=window.MidnightArchive,page="__PAGE__",root=document.getElementById("root"),e=MA.escapeHTML;
let films=MA.initial;
const avg=MA.combined;
const fmt=n=>Number(n).toFixed(1);
const avgFmt=n=>Number(n).toFixed(2);
function hero(title,description,eyebrow="Bobby & Lisa • Film journal"){return '<div class="page-hero"><div class="eyebrow">'+e(eyebrow)+'</div><h1>'+title+'</h1><p>'+e(description)+'</p></div>';}
function poster(f,cls="poster-mini"){return '<div class="'+cls+'"><span class="poster-fallback">'+e(f.title)+'</span><img src="'+e(MA.safeUrl(f.poster))+'" data-backup="'+e(MA.safeUrl(f.posterBackup||""))+'" loading="lazy" alt="'+e(f.title)+' movie poster"></div>';}
document.addEventListener("error",evt=>{const img=evt.target;if(img?.tagName==="IMG"&&img.hasAttribute("data-backup")){if(img.dataset.backup&&!img.dataset.used){img.dataset.used="1";img.src=img.dataset.backup;}else{img.style.display="none";}}},true);
const byCombined=()=>MA.rank(films);
const stat=(v,t)=>'<div class="stat"><strong>'+e(v)+'</strong><small>'+e(t)+'</small></div>';
const link=f=>MA.movieUrl(f);
function movieLabel(f){return '<a href="'+link(f)+'">'+e(f.title)+'</a>';}
function statsData(){return {bAvg:films.reduce((s,f)=>s+f.b,0)/films.length,lAvg:films.reduce((s,f)=>s+f.l,0)/films.length,shared:films.filter(f=>f.b>=7&&f.l>=7),agree:films.filter(f=>Math.abs(f.b-f.l)<=0.5),diff:MA.rank(films).sort((a,b)=>Math.abs(b.b-b.l)-Math.abs(a.b-a.l))};}
function renderCompare(){
const {bAvg,lAvg,agree,diff,shared}=statsData();
root.innerHTML=hero('Two critics. <em>Two perspectives.</em>','Where Bobby and Lisa agree, disagree, and fall on opposite sides of a movie night. Every comparison uses our own ratings.','Head-to-head • The verdicts')+
'<section class="stat-grid">'+stat(films.length,'Movies compared')+stat(agree.length,'Close calls (≤ 0.5)')+stat(diff.length?avgFmt(Math.abs(diff[0].b-diff[0].l)):'—','Biggest disagreement')+stat(bAvg<lAvg?'Bobby':'Lisa','Tougher average critic')+'</section>'+
'<section class="section"><div class="section-heading"><h2>Biggest disagreements.</h2><p>Sorted by the absolute difference between our scores. Bigger gaps mean stronger disagreement.</p></div><div class="surface">'+diff.map((f,i)=>{
 const gap=Math.abs(f.b-f.l);const winner=f.b>f.l?'Bobby':f.l>f.b?'Lisa':'Tie';
 return '<article class="compare-row"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><a href="'+link(f)+'">'+poster(f)+'</a><div><h3 class="movie-name">'+movieLabel(f)+'</h3><div class="meta">'+e(f.year)+' · '+e(f.genre)+'</div><div class="difference">'+(gap===0?'Same score':winner+' rated it '+avgFmt(gap)+' higher')+'</div></div><div class="bars"><div class="bar-line"><label>Bobby</label><div class="bar-shell"><div class="bar-fill" style="width:'+(f.b*10)+'%"></div></div><strong>'+fmt(f.b)+'</strong></div><div class="bar-line lisa"><label>Lisa</label><div class="bar-shell"><div class="bar-fill" style="width:'+(f.l*10)+'%"></div></div><strong>'+fmt(f.l)+'</strong></div></div></article>';
 }).join('')+'</div></section>'+
'<section class="section"><div class="section-heading"><h2>Movies we both loved.</h2><p>Each of us scored these at least 7.0 out of 10.</p></div><div class="favorites">'+(shared.length?MA.rank(shared).map(f=>'<a class="favorite" href="'+link(f)+'">'+poster(f)+'<div><strong>'+e(f.title)+'</strong><small>Bobby '+fmt(f.b)+' / Lisa '+fmt(f.l)+'<br>Combined '+avgFmt(avg(f))+'</small></div></a>').join(''):'<div class="empty">More shared favorites will appear as we rate new movies.</div>')+'</div></section>';
}
function renderStats(){
const {bAvg,lAvg,agree,shared,diff}=statsData();const topB=MA.rank(films,"b")[0],topL=MA.rank(films,"l")[0],top=byCombined()[0];const who=films.filter(f=>f.b>f.l).length,her=films.filter(f=>f.l>f.b).length,ties=films.length-who-her;
const genres=[
 {label:'Slashers',match:f=>/slasher/i.test(f.genre)||f.franchise==='Friday the 13th'},
 {label:'Horror & thrillers',match:f=>/horror|thriller|footage|slasher/i.test(f.genre)},
 {label:'Comedy',match:f=>/comedy/i.test(f.genre)},
 {label:'Friday the 13th',match:f=>f.franchise==='Friday the 13th'},
 {label:'Other movies',match:f=>!/horror|thriller|footage|slasher|comedy/i.test(f.genre)}
];const max=Math.max(1,...genres.map(g=>films.filter(g.match).length));
root.innerHTML=hero('The numbers <em>behind the nights.</em>','Our personal movie statistics, favorites and patterns. Automatically updated whenever a new review is added.','Our movie-night report card')+
'<section class="stat-grid">'+stat(films.length,'Total screenings')+stat(avgFmt(bAvg),'Bobby’s average')+stat(avgFmt(lAvg),'Lisa’s average')+stat(avgFmt(avg(top)),'Top combined score')+'</section>'+
'<section class="section"><div class="section-heading"><h2>Our personal number ones.</h2><p>No averaged taste here—just each person’s own favorite.</p></div><div class="favorites">'+
[[topB,'Bobby’s #1'],[topL,'Lisa’s #1'],[top,'Our combined #1']].map(([f,label])=>'<a class="favorite" href="'+link(f)+'">'+poster(f)+'<div><span class="section-label">'+e(label)+'</span><strong style="margin-top:8px">'+e(f.title)+'</strong><small>'+avgFmt(label.includes('combined')?avg(f):label.includes('Bobby')?f.b:f.l)+'/10</small></div></a>').join('')+'</div></section>'+
'<section class="section"><div class="section-heading"><h2>Our viewing habits.</h2><p>Tags overlap when a movie fits more than one category.</p></div><div class="genre-grid">'+genres.map(g=>{const count=films.filter(g.match).length;return '<div class="genre-card"><h3>'+e(g.label)+'</h3><p>'+count+' '+(count===1?'film':'films')+'</p><div class="genre-meter"><i style="width:'+(count/max*100)+'%"></i></div></div>';}).join('')+'</div></section>'+
'<section class="section"><div class="section-heading"><h2>Rating patterns.</h2><p>A small scoreboard of our disagreements—not a prediction of future ratings.</p></div><div class="stat-grid">'+stat(who,'Bobby scored higher')+stat(her,'Lisa scored higher')+stat(ties,'Exact rating ties')+stat(agree.length,'Within half a point')+'</div></section>'+
'<section class="section"><div class="section-heading"><h2>Our movie-night awards.</h2><p>Automatically awarded from the scores we gave—not from outside critics.</p></div><div class="favorites">'+
[[top,"Best picture together",avgFmt(avg(top))],[topB,"Bobby's choice",fmt(topB.b)],[topL,"Lisa's choice",fmt(topL.l)],...(diff[0]?[[diff[0],"Biggest disagreement",avgFmt(Math.abs(diff[0].b-diff[0].l))+" point gap"]]:[]),...(MA.rank(films.filter(f=>f.franchise==="Friday the 13th"))[0]?[[(MA.rank(films.filter(f=>f.franchise==="Friday the 13th"))[0]),"Crystal Lake standout",avgFmt(avg(MA.rank(films.filter(f=>f.franchise==="Friday the 13th"))[0]))]]:[])].map(([f,label,score])=>'<a class="favorite" href="'+link(f)+'">'+poster(f)+'<div><span class="section-label">'+e(label)+'</span><strong style="margin-top:8px">'+e(f.title)+'</strong><small>'+e(score)+'</small></div></a>').join('')+'</div></section>'+
'<section class="section"><div class="section-heading"><h2>More to explore.</h2></div><div class="toolbar"><a class="btn" href="/midnight-archive/compare/">See our biggest disagreements ↗</a><a class="btn-plain" href="/midnight-archive/timeline/">Our watch-history timeline</a></div></section>';
}
function formatDate(iso){if(!iso)return "Date not recorded";const d=new Date(iso+"T12:00:00");return Number.isNaN(d.valueOf())?"Date not recorded":new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric'}).format(d);}
function renderTimeline(){
const chronological=[...films].sort((a,b)=>(a.watch_order||a.id)-(b.watch_order||b.id));const dated=chronological.filter(f=>f.watched_on).length;const series=[...new Set(films.map(f=>f.franchise).filter(Boolean))];
root.innerHTML=hero('Our movie-night <em>history.</em>','Every film in watch order, with actual dates when we recorded them. Unknown dates are intentionally left blank rather than guessed.','Watch history • Our story')+
'<section class="stat-grid">'+stat(films.length,'Movies watched')+stat(dated,'Dates confirmed')+stat(series.length,'Series represented')+stat(films.filter(f=>f.franchise==='Friday the 13th').length,'Fridays watched')+'</section>'+
'<div class="form-intro"><strong>About the dates:</strong> We recorded the order of our 17 original movies, but not every exact screening date. Confirmed dates appear on their cards; you can fill in missing dates securely from the Add/Edit Movie page.</div>'+
'<section class="section"><div class="section-heading"><h2>From the first movie night on.</h2><p>Oldest logged screening first. New reviews join the end of the timeline automatically.</p></div><div class="timeline">'+chronological.map((f,i)=>'<article class="time-row"><div class="time-stamp">'+(f.watched_on?formatDate(f.watched_on):'#'+String(i+1).padStart(2,'0')+' in watch order')+'</div><div class="time-content"><a href="'+link(f)+'">'+poster(f)+'</a><div><h3>'+movieLabel(f)+'</h3><p>'+e(f.year)+' · '+e(f.franchise||f.genre)+'</p><p><strong style="color:#eac28f">Combined '+avgFmt(avg(f))+'</strong> · Bobby '+fmt(f.b)+' · Lisa '+fmt(f.l)+'</p>'+(f.watched_on?'':'<p>Screening date not recorded</p>')+'</div></div></article>').join('')+'</div></section>'+
'<section class="section"><div class="section-heading"><h2>Franchise progress.</h2><p>How many movies we have logged in each series so far.</p></div><div class="genre-grid">'+[...new Set(films.map(f=>f.franchise).filter(Boolean))].map(fr=>{
const count=films.filter(f=>f.franchise===fr).length;return '<div class="genre-card"><h3>'+e(fr)+'</h3><p>'+count+' '+(count===1?'screening':'screenings')+' in our journal</p><div class="genre-meter"><i style="width:'+Math.min(100,count/Math.max(1,films.length)*250)+'%"></i></div></div>';}).join('')+'</div></section>'+
'<section class="section"><div class="section-heading"><h2>Keep the history accurate.</h2></div><div class="toolbar"><a class="btn" href="/midnight-archive/add/">Add a film or correct a date</a><a class="btn-plain" href="/midnight-archive/">Browse the highest-rated films</a></div></section>';
}
function field(label,value){return value?'<dt>'+e(label)+'</dt><dd>'+e(value)+'</dd>':'';}
function renderMovie(){
const id=Number(new URLSearchParams(location.search).get("id"));const f=films.find(f=>f.id===id);
if(!f){
root.innerHTML=hero('Pick a <em>screening.</em>','Choose a movie from the collection to open its full personal review.')+'<div class="favorites">'+byCombined().map(f=>'<a class="favorite" href="'+link(f)+'">'+poster(f)+'<div><strong>'+e(f.title)+'</strong><small>Combined '+avgFmt(avg(f))+'</small></div></a>').join('')+'</div>';return;
}
const ordered=byCombined(),idx=ordered.findIndex(m=>m.id===f.id),prev=ordered[idx-1],next=ordered[idx+1];
document.title=f.title+' ('+f.year+') — The Midnight Archive';
const tagline=()=>'<a class="btn-plain" href="'+e(MA.imdbUrl(f))+'" target="_blank" rel="noopener noreferrer">View on IMDb ↗</a>';
root.innerHTML='<div class="breadcrumb"><a href="/midnight-archive/">Movie Vault</a> / <span>'+e(f.title)+'</span></div>'+
'<div class="movie-layout"><aside class="movie-side">'+poster(f,"movie-poster")+'<div>'+tagline()+'<a class="btn-plain" href="/midnight-archive/compare/">Compare our taste ↗</a></div></aside>'+
'<article class="movie-main"><div class="eyebrow">Our #'+(idx+1)+' movie together • The after-credits report</div><h1>'+e(f.title)+'</h1><div class="movie-sub">'+e(f.year)+' · '+e(f.genre)+' · '+e(f.franchise||'Standalone film')+(f.watched_on?' · Watched '+formatDate(f.watched_on):'')+'</div>'+
'<div class="score-trio"><div class="score-tile"><strong>'+fmt(f.b)+'</strong><span>Bobby / 10</span></div><div class="score-tile"><strong>'+fmt(f.l)+'</strong><span>Lisa / 10</span></div><div class="score-tile"><strong>'+avgFmt(avg(f))+'</strong><span>Combined / 10</span></div></div>'+
'<section class="review-panel"><h2>Bobby’s take</h2><p>'+e(f.br||"Detailed notes not recorded.")+'</p></section>'+
'<section class="review-panel lisa-review"><h2>Lisa’s take</h2><p>'+e(f.lr||"Detailed notes not recorded.")+'</p></section>'+
'<div class="picks"><section class="review-panel"><h2>Bobby’s favorites</h2><dl>'+field("Favorite character",f.bc)+field("Favorite scene",f.bs)+field("Favorite kill / moment",f.bk)+field("Rewatch?",f.rb)+'</dl></section>'+
'<section class="review-panel lisa-review"><h2>Lisa’s favorites</h2><dl>'+field("Favorite character",f.lc)+field("Favorite scene",f.ls)+field("Favorite kill / moment",f.lk)+field("Rewatch?",f.rl)+'</dl></section></div>'+
'<div class="toolbar"><a class="btn-plain" href="/midnight-archive/add/?edit='+f.id+'">Edit this movie ↗</a><span class="hint">Spoilers are part of our reviews.</span></div>'+
'</article></div><nav class="nextprev" aria-label="Other ranked movies"><span>'+(prev?'<a class="btn-plain" href="'+link(prev)+'">← #'+idx+' '+e(prev.title)+'</a>':'')+'</span><span>'+(next?'<a class="btn-plain" href="'+link(next)+'">#'+(idx+2)+' '+e(next.title)+' →</a>':'')+'</span></nav>';
}
async function renderAdd(){
root.innerHTML=hero('Add to the <em>archive.</em>','Bobby and Lisa can securely add a movie or improve an existing review. Only the two authorized accounts can save changes.','Private screening journal • Editors only')+
'<div class="editor"><div class="form-intro"><strong>Private editor.</strong> Everyone with the archive link can read the reviews, but only Bobby and Lisa’s existing BBB accounts are allowed to add or change movies. Changes appear across the collection automatically.</div>'+
'<section class="edit-card" id="auth-card"><h2>Sign in to edit.</h2><p class="intro" id="auth-status">Checking your account…</p>'+
'<form id="auth-form" class="hidden"><div class="fields"><div class="field"><label for="login-email">Account email</label><input type="email" id="login-email" required autocomplete="username"></div><div class="field"><label for="login-password">Password</label><input type="password" id="login-password" autocomplete="current-password"></div></div><div class="edit-tools"><button class="btn" type="submit">Sign in with password</button><button class="btn-plain" type="button" id="magic-link">Email me a sign-in link</button></div></form></section>'+
'<section class="edit-card hidden" id="editor-card"><div class="section-heading"><h2>Our movie journal.</h2><button id="sign-out" class="btn-plain" type="button">Sign out</button></div><p class="intro" id="account-line"></p>'+
'<form id="movie-form"><div class="fields"><div class="field full"><label for="edit-movie">Choose a movie to edit, or add a new one</label><select id="edit-movie"></select></div>'+
'<div class="field"><label for="edit-title">Film title *</label><input id="edit-title" required maxlength="180" placeholder="e.g. A Nightmare on Elm Street"></div>'+
'<div class="field"><label for="edit-year">Release year *</label><input id="edit-year" required type="number" min="1880" max="2200"></div>'+
'<div class="field"><label for="edit-genre">Genre</label><input id="edit-genre" placeholder="Horror / Thriller"></div>'+
'<div class="field"><label for="edit-franchise">Franchise / series</label><input id="edit-franchise" placeholder="Friday the 13th"></div>'+
'<div class="field"><label for="edit-watched">Date we watched (optional)</label><input type="date" id="edit-watched"><small>Leave blank unless the date is confirmed.</small></div>'+
'<div class="field"><label for="edit-imdb">IMDb title ID (optional)</label><input id="edit-imdb" placeholder="tt1234567" pattern="tt[0-9]{7,9}"></div>'+
'<div class="field full"><label for="edit-poster">Official poster image URL (HTTPS)</label><input id="edit-poster" type="url" placeholder="https://…"></div>'+
'<div class="field full"><label for="edit-poster-source">Poster source</label><input id="edit-poster-source" placeholder="IMDb, Paramount, TMDb, etc."></div>'+
'<div class="field"><label for="edit-b">Bobby’s rating (0–10) *</label><input id="edit-b" type="number" min="0" max="10" step=".1" required></div>'+
'<div class="field"><label for="edit-l">Lisa’s rating (0–10) *</label><input id="edit-l" type="number" min="0" max="10" step=".1" required></div>'+
'<div class="field full"><label for="edit-br">Bobby’s review</label><textarea id="edit-br" rows="5"></textarea></div>'+
'<div class="field full"><label for="edit-lr">Lisa’s review</label><textarea id="edit-lr" rows="5"></textarea></div>'+
'<div class="field"><label for="edit-bc">Bobby’s favorite character</label><input id="edit-bc"></div><div class="field"><label for="edit-lc">Lisa’s favorite character</label><input id="edit-lc"></div>'+
'<div class="field"><label for="edit-bs">Bobby’s favorite scene</label><textarea id="edit-bs" rows="2"></textarea></div><div class="field"><label for="edit-ls">Lisa’s favorite scene</label><textarea id="edit-ls" rows="2"></textarea></div>'+
'<div class="field"><label for="edit-bk">Bobby’s favorite kill / moment</label><input id="edit-bk"></div><div class="field"><label for="edit-lk">Lisa’s favorite kill / moment</label><input id="edit-lk"></div>'+
'<div class="field"><label for="edit-rb">Bobby rewatch plans</label><input id="edit-rb"></div><div class="field"><label for="edit-rl">Lisa rewatch plans</label><input id="edit-rl"></div></div>'+
'<div class="edit-tools"><button id="save-movie" class="btn" type="submit">Save movie</button><button id="reset-movie" class="btn-plain" type="button">Start a new movie</button></div><div id="editor-status" role="status"></div></form></section></div>';
const authStatus=document.getElementById("auth-status"),authForm=document.getElementById("auth-form"),card=document.getElementById("editor-card"),select=document.getElementById("edit-movie"),form=document.getElementById("movie-form"),status=document.getElementById("editor-status");
let client=null,activeUser=null;
const authors=new Set(["01cfc6c7-68d9-4803-997c-3ff2060c1987","76350a76-1034-454b-8f73-0bd4033888f7"]);
function message(msg,kind=""){status.innerHTML='<div class="form-message '+kind+'">'+e(msg)+'</div>';}
function signinStatus(msg,isError=false){authStatus.textContent=msg;authStatus.style.color=isError?"#f2b4be":"";}
function makeOptions(){select.innerHTML='<option value="">＋ Add a new movie</option>'+[...films].sort((a,b)=>a.title.localeCompare(b.title)).map(f=>'<option value="'+f.id+'">'+e(f.title)+' ('+f.year+')</option>').join('');}
const fields=["title","year","genre","franchise","poster","posterSource","imdb_id","b","l","br","lr","bc","lc","bs","ls","bk","lk","rb","rl"];
function inputKey(k){return "edit-"+({posterSource:"poster-source",imdb_id:"imdb"}[k]||k);}
function resetForm(){form.reset();select.value="";for(const k of fields){const el=document.getElementById(inputKey(k));if(el)el.value="";}document.getElementById("edit-watched").value="";message("New movie. Fill in the details and both ratings.");}
function chooseMovie(){
const selectedId=select.value;const movie=films.find(f=>String(f.id)===selectedId);form.reset();select.value=selectedId;
if(!movie){resetForm();return;}
for(const k of fields){const el=document.getElementById(inputKey(k));if(el)el.value=movie[k]??"";}
document.getElementById("edit-watched").value=movie.watched_on||"";
message("Editing "+movie.title+". Save to update its record throughout the archive.");
}
function showEditor(user){
activeUser=user;document.getElementById("auth-card").classList.add("hidden");card.classList.remove("hidden");document.getElementById("account-line").textContent="Signed in as "+user.email+". Only Bobby and Lisa have database write permission.";
makeOptions();const requested=new URLSearchParams(location.search).get("edit");
if(requested&&films.find(x=>String(x.id)===requested)){select.value=requested;chooseMovie();}else resetForm();
}
async function checkAuth(){
const {data,error}=await client.auth.getUser();
if(error||!data?.user||!authors.has(data.user.id)){
 authForm.classList.remove("hidden");
 signinStatus(data?.user?"This account cannot edit The Midnight Archive. Sign out of the account or sign in as Bobby/Lisa.":"Sign in with your existing Bobby or Lisa BBB account to continue.",!!data?.user);
 if(data?.user)document.getElementById("auth-form").querySelector('button[type="submit"]').textContent="Switch account";
 return;
}
showEditor(data.user);
}
try{
if(!window.supabase?.createClient){
 const tag=document.createElement("script");tag.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.84.0/dist/umd/supabase.js";
 await new Promise((resolve,reject)=>{tag.onload=resolve;tag.onerror=()=>reject(new Error("Sign-in library could not load"));document.head.appendChild(tag);});
}
client=window.supabase.createClient(MA.SUPABASE_URL,MA.PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
await checkAuth();
}catch(err){signinStatus("Secure login is temporarily unavailable. Please try again later.",true);return;}
authForm.addEventListener("submit",async ev=>{ev.preventDefault();signinStatus("Signing in…");
const email=document.getElementById("login-email").value.trim(),password=document.getElementById("login-password").value;
if(!email||!password){signinStatus("Enter your email and password, or choose the sign-in link option.",true);return;}
const {error}=await client.auth.signInWithPassword({email,password});
if(error){signinStatus(error.message,true);return;}await checkAuth();});
document.getElementById("magic-link").addEventListener("click",async()=>{
const email=document.getElementById("login-email").value.trim();if(!email){signinStatus("Enter your account email first.",true);return;}
const {error}=await client.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:location.origin+"/midnight-archive/add/"}});
signinStatus(error?error.message:"If the account exists, an email sign-in link was sent. Open it and return to this page.",!!error);
});
document.getElementById("sign-out").addEventListener("click",async()=>{await client.auth.signOut();location.replace("/midnight-archive/add/");});
select.addEventListener("change",chooseMovie);
document.getElementById("reset-movie").addEventListener("click",resetForm);
form.addEventListener("submit",async ev=>{
ev.preventDefault();if(!activeUser||!authors.has(activeUser.id)){message("Not authorized to save movies.","error");return;}
const get=k=>String(document.getElementById(inputKey(k)).value||"").trim();
const b=Number(get("b")),l=Number(get("l")),year=Number(get("year"));
if(!Number.isFinite(b)||!Number.isFinite(l)||b<0||b>10||l<0||l>10||!Number.isInteger(year)||year<1880||year>2200){message("Both scores must be between 0 and 10, and the release year must be valid.","error");return;}
const poster=get("poster");
if(poster&&!MA.safeUrl(poster)){message("The poster URL must use HTTPS.","error");return;}
const imdb=get("imdb_id");if(imdb&&!/^tt\d{7,9}$/.test(imdb)){message("IMDb ID must look like tt1234567.","error");return;}
const existing=films.find(f=>String(f.id)===select.value);
const data={...(existing||{}),title:get("title"),year,genre:get("genre"),franchise:get("franchise"),poster,posterSource:get("posterSource")||"Poster source not specified",imdb_id:imdb,b,l};
for(const k of ["br","lr","bc","lc","bs","ls","bk","lk","rb","rl"])data[k]=get(k);
if(!data.title){message("Enter a film title.","error");return;}
delete data.watched_on;delete data.watch_order;delete data.updated_at;
const watchedOn=document.getElementById("edit-watched").value||null,button=document.getElementById("save-movie");
button.disabled=true;button.textContent="Saving…";message("Saving your movie securely…");
try{
let result;
if(existing){
 result=await client.from("midnight_archive_films").update({payload:data,watched_on:watchedOn,updated_at:new Date().toISOString()}).eq("id",existing.id).select("id").single();
}else{
 const order=1+Math.max(0,...films.map(f=>f.watch_order||f.id));
 result=await client.from("midnight_archive_films").insert({payload:data,watched_on:watchedOn,watch_order:order}).select("id").single();
}
if(result.error)throw result.error;
MA.clearCache();films=await MA.load(true);makeOptions();
select.value=String(result.data.id);chooseMovie();message("Saved! "+data.title+" is now in the archive. The rankings, stats, timeline and movie page will reflect it.","success");
}catch(err){message("Could not save: "+(err.message||"Please try again."),"error");}
finally{button.disabled=false;button.textContent="Save movie";}
});
}
async function start(){
try{films=await MA.load();}catch(err){console.warn(err);films=MA.initial;}
if(!films.length){root.innerHTML=hero('No movies available.','The archive is temporarily empty.');return;}
if(page==='compare')renderCompare();
else if(page==='stats')renderStats();
else if(page==='timeline')renderTimeline();
else if(page==='movie')renderMovie();
else if(page==='add')await renderAdd();
}
start();
})();
</script>
