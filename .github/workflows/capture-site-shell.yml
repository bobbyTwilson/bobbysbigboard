name: Capture Site Shell

on:
  push:
    branches:
      - structural-cleanup
    paths:
      - .github/workflows/capture-site-shell.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: structural-cleanup

      - name: Capture current production shell
        run: |
          curl --fail --silent --show-error --location \
            'https://bobbys-big-board-v2-pmu5e6526-bobbywilsonbtw-2065.vercel.app' \
            --output site-shell.html
          test -s site-shell.html
          grep -q "Bobby's Big Board" site-shell.html

      - name: Commit shell snapshot
        run: |
          git config user.name 'bbb-structural-cleanup'
          git config user.email 'actions@users.noreply.github.com'
          git add site-shell.html
          if git diff --cached --quiet; then
            echo 'Shell snapshot already current.'
            exit 0
          fi
          git commit -m 'Snapshot production site shell [skip ci]'
          git push origin HEAD:structural-cleanup
